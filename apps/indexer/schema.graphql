# Data model for the Mondeto indexer.
#
# Conventions:
# - Addresses are lowercase everywhere (config sets address_format: lowercase).
# - Money fields (totalCost, totalSpent, pricePaid) are in the contract's
#   PRICE_DECIMALS base units, exactly as emitted — no token-decimals scaling.
# - Composite ids use "-" separators: Pixel "<mapId>-<pixelId>",
#   OwnerMapStats "<mapId>-<address>", PurchaseBatch "<txHash>-<logIndex>",
#   Purchase "<txHash>-<logIndex>-<arrayIndex>".
#
# Run `pnpm codegen` after editing this file.

"Current state of one pixel on one map."
type Pixel {
  "<mapId>-<pixelId>"
  id: ID!
  mapId: Int! @index
  pixelId: BigInt!
  "Current holder (lowercase address)."
  owner: String! @index
  "How many times this pixel has been sold in total."
  saleCount: Int!
  """
  Exact price of the last sale when it was a single-pixel purchase; null when
  the pixel last changed hands inside a multi-pixel batch (the contract only
  emits the batch total — see PurchaseBatch.totalCost).
  """
  lastPricePaid: BigInt
  lastSoldAt: BigInt!
  lastTxHash: String!
}

"Global (cross-map) aggregate per wallet."
type Owner {
  "Lowercase address."
  id: ID!
  address: String!
  "Pixels currently held across all maps."
  pixelCount: Int!
  "Gross spend across all maps, PRICE_DECIMALS base units. Never decremented."
  totalSpent: BigInt!
  firstPurchaseAt: BigInt!
  lastPurchaseAt: BigInt!
}

"Per-(map, wallet) aggregate — the leaderboard row."
type OwnerMapStats {
  "<mapId>-<address>"
  id: ID!
  mapId: Int! @index
  address: String! @index
  "Pixels currently held on this map."
  pixelCount: Int!
  "Gross spend on this map, PRICE_DECIMALS base units. Never decremented."
  totalSpent: BigInt!
}

"""
One PixelsPurchased event as emitted: the pixel-id batch plus the batch total.
This is the only place the exact on-chain cost lives for multi-pixel buys —
the contract does not emit per-pixel prices, and splitting totalCost evenly
would be wrong (epoch pricing makes per-pixel cost depend on each pixel's
sale history).
"""
type PurchaseBatch {
  "<txHash>-<logIndex>"
  id: ID!
  mapId: Int! @index
  buyer: String! @index
  "Stablecoin the buyer paid with (lowercase address)."
  token: String!
  pixelIds: [BigInt!]!
  pixelCountInBatch: Int!
  "Batch total in PRICE_DECIMALS base units."
  totalCost: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: String!
}

"""
One pixel changing hands. previousOwner is the raid record: who held the
pixel before this buyer took it (null on a first claim from the map).
"""
type Purchase {
  "<txHash>-<logIndex>-<arrayIndex>"
  id: ID!
  batchId: String! @index
  mapId: Int! @index
  buyer: String! @index
  pixelId: BigInt!
  previousOwner: String @index
  """
  Exact per-pixel price only when the batch contained a single pixel;
  null otherwise — read the batch total from PurchaseBatch instead.
  """
  pricePaid: BigInt
  timestamp: BigInt!
  txHash: String!
}

"Latest ProfileUpdated state per (map, wallet) — profiles are per contract."
type OwnerProfile {
  "<mapId>-<address>"
  id: ID!
  mapId: Int! @index
  address: String! @index
  "uint24 RGB color as an integer."
  color: Int!
  "Raw label bytes as emitted (0x-prefixed hex)."
  labelHex: String!
  "Best-effort UTF-8 decode of labelHex."
  label: String!
  "Raw url bytes as emitted (0x-prefixed hex)."
  urlHex: String!
  "Best-effort UTF-8 decode of urlHex."
  url: String!
  updatedAt: BigInt!
}
