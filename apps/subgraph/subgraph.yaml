# Goldsky subgraph manifest for the Mondeto pixel maps on Celo mainnet.
#
# All eight maps are separate UUPS proxies of the same Mondeto implementation,
# so every dataSource shares one ABI + one mapping file. The frontend mapId is
# injected per contract via dataSource.context (read in the mapping with
# dataSource.context().getI32("mapId")).
#
# KEEP ADDRESSES IN SYNC with apps/web/src/lib/maps/contracts.ts (source of truth).
# Regenerate with: node scripts/gen-subgraph-yaml.js (see README).
specVersion: 1.0.0
description: Ownership, purchase history, earn/spend and analytics for Mondeto on Celo
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Mondeto0
    network: celo
    context:
      mapId:
        type: Int
        data: 0
    source:
      address: "0xA8cFC1B4365518f56954382B6Fab25a5382f5C49" # 0 world
      abi: Mondeto
      startBlock: 71123574
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Pixel
        - Owner
        - OwnerMapStat
        - PurchaseBatch
        - Purchase
        - OwnerProfile
        - Token
        - MapStat
        - ActiveBuyer
      abis:
        - name: Mondeto
          file: ./abis/Mondeto.json
      eventHandlers:
        - event: PixelsPurchased(indexed address,indexed address,uint256[],uint256)
          handler: handlePixelsPurchased
        - event: ProfileUpdated(indexed address,uint24,bytes,bytes)
          handler: handleProfileUpdated
        - event: AcceptedTokenAdded(indexed address,uint8)
          handler: handleAcceptedTokenAdded
        - event: AcceptedTokenRemoved(indexed address)
          handler: handleAcceptedTokenRemoved
        - event: FeeRateUpdated(uint256)
          handler: handleFeeRateUpdated
