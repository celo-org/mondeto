packages:
  - "apps/*"
# pnpm 10 skips dependency build scripts unless the package is listed here;
# pnpm 8 ran them all. Listing the six that pnpm reports preserves pnpm 8's
# behaviour, so this upgrade does not quietly change what gets built.
onlyBuiltDependencies:
  - "@reown/appkit"
  - bufferutil
  - core-js
  - keccak
  - unrs-resolver
  - utf-8-validate
# Security floors for transitive deps a direct bump cannot reach.
# @graphprotocol/graph-cli pins undici to exactly 7.9.0; jsdom's range
# (^7.24.3) and @whatwg-node/node-fetch's busboy range (^3.1.1) already admit
# the fixed versions. Range selectors only rewrite vulnerable resolutions, so
# a later upstream bump past the floor takes over without editing this.
overrides:
  "@fastify/busboy@<3.2.2": ^3.2.2   # GHSA-x8mw-p69m-v3mx + later busboy alerts
  "undici@>=7.0.0 <7.30.1": ^7.30.1  # GHSA-rfgv-xxqx-mfg5 + later undici 7.x alerts
