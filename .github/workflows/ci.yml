name: CI

# Gate merges on lint + type-check + unit tests via the pm-kit shared
# baseline (celo-org/pm-kit ci-node.yml). Deploys/build are handled by
# Vercel; this workflow is the fast correctness check — in particular the
# regression guards for the silent RPC-data failures (getLogs chunk size,
# transport failover config). Coverage floors live in
# apps/web/vitest.config.ts and fail the `test` step on regression.
# `pull_request` is unfiltered, matching pm-kit's caller template and the
# other repos on the shared baseline. That covers the collaboration flow
# (feature -> PR into staging -> verify on the staging URL -> staging -> main)
# without enumerating branch names, so adding a branch never means remembering
# to edit this file. `push` stays narrow: post-merge verification is only
# meaningful on the two branches people treat as verified.
on:
  pull_request:
  push:
    branches: [main, staging]

# Cancel superseded runs on the same ref so a rapid push sequence doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: celo-org/pm-kit/.github/workflows/ci-node.yml@main
    with:
      # Fallback only. pm-kit's detect step prefers `.nvmrc` (added alongside
      # this), so that file is the single source of truth for the Node version
      # and this input applies only if it is ever deleted. Keep the two in sync.
      node-version: '20'
      # Vercel builds; CI is the correctness gate. This is the org-wide
      # decision, not a local workaround and not a temporary state — every
      # deploy-elsewhere repo on the pm-kit baseline sets it the same way
      # (mondeto-admin, mini-quiz, askbots). pm-kit's own default is `true`
      # for repos with no deployment platform doing the build; we have one,
      # and duplicating its build in CI buys a slower merge for a signal
      # Vercel already produces on every PR via the preview deployment.
      #
      # Consequence worth stating rather than discovering: a build break
      # surfaces on the Vercel check, not on `ci / ci`. Only `ci / ci` is a
      # required status check, so read the preview deployment before merging.
      run-build: false
