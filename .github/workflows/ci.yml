name: CI

# Gate merges on lint + type-check + unit tests via the pm-kit shared
# baseline (celo-org/pm-kit ci-node.yml). Deploys/build are handled by
# Vercel; this workflow is the fast correctness check — in particular the
# regression guards for the silent RPC-data failures (getLogs chunk size,
# transport failover config). Coverage floors live in
# apps/web/vitest.config.ts and fail the `test` step on regression.
# Runs on `staging` as well as `main`: the collaboration flow is
# feature -> PR into staging -> verify on the staging URL -> staging -> main,
# and a check that only guards the last hop lets a broken change sit on
# staging while everyone treats staging as verified.
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# Cancel superseded runs on the same ref so a rapid push sequence doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: celo-org/pm-kit/.github/workflows/ci-node.yml@main
    with:
      # Fallback only. pm-kit's detect step prefers `.nvmrc` (added alongside
      # this), so that file is the single source of truth for the Node version
      # and this input applies only if it is ever deleted. Keep the two in sync.
      node-version: '20'
      # Still false, and deliberately — measured, not assumed. pm-kit runs
      # `pnpm run build` at the repo ROOT, which turbo fans out to every
      # package, and `subgraph#build` fails on a clean checkout: `graph build`
      # needs `graph codegen` to have written `generated/` first, and turbo.json
      # does not declare that dependency. So flipping this today turns every PR
      # red for a reason that has nothing to do with the change under review.
      # `pnpm --filter web build` passes on its own. Tracked separately; this
      # issue's scope guard rules out subgraph CI work.
      run-build: false
